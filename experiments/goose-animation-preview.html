<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Isolated goose flight animation</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #e8efec; color: #20312f; font: 15px/1.4 system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .label { position: fixed; top: 24px; left: 28px; letter-spacing: .14em; font-size: 11px; font-weight: 700; color: #50635f; }
    .readout { position: fixed; top: 48px; left: 28px; font-size: 14px; font-weight: 650; }
    .angle { position: fixed; right: 28px; top: 26px; min-width: 150px; text-align: right; font: 600 12px/1.4 ui-monospace, monospace; color: #50635f; }
    .hint { position: fixed; left: 28px; bottom: 24px; letter-spacing: .08em; font: 600 11px/1.4 ui-monospace, monospace; color: #50635f; pointer-events: none; }
    @media (max-width: 600px) { .label, .readout, .hint { left: 16px; } .angle { right: 16px; } }
  </style>
</head>
<body>
  <div class="label">ISOLATED FLIGHT ANIMATION</div>
  <div class="readout" id="phase">Folded wings point toward neck · unfold 90° · flap · fold</div>
  <div class="angle" id="angle">FLAP ANGLE 0°</div>
  <div class="hint">DRAG TO ROTATE · SCROLL TO ZOOM</div>
  <canvas id="preview"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { animateGoose, createGooseModel, gooseRig, WING_FLAP_AMPLITUDE } from '../goose.js';

    const canvas = document.querySelector('#preview');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#e8efec');
    const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, .1, 100);
    camera.position.set(-3.2, 6.5, 7);
    camera.lookAt(0, .55, 0);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, .55, 0);
    controls.enableDamping = true;
    controls.dampingFactor = .08;
    controls.enablePan = false;
    controls.minDistance = 3;
    controls.maxDistance = 14;
    controls.minPolarAngle = .05;
    controls.maxPolarAngle = Math.PI - .05;
    controls.update();

    scene.add(new THREE.HemisphereLight(0xffffff, 0x74817b, 2.2));
    const key = new THREE.DirectionalLight(0xfff8ed, 3.2);
    key.position.set(-3, 5, 4);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xa9c8d2, 1.4);
    fill.position.set(4, 1, -3);
    scene.add(fill);

    const root = new THREE.Group();
    const body = new THREE.Group();
    const model = createGooseModel();
    const modelBounds = new THREE.Box3().setFromObject(model);
    const modelSize = modelBounds.getSize(new THREE.Vector3());
    const modelCenter = modelBounds.getCenter(new THREE.Vector3());
    modelCenter.y = modelBounds.min.y;
    body.scale.setScalar(1.5 / Math.max(modelSize.x, modelSize.z));
    model.position.sub(modelCenter);
    const actor = {
      root, body, model, goose: gooseRig(model), gait: 0, speed: 2.1, airborne: true,
      wingOpen: 0, wingFlapAmount: 0,
    };
    body.add(model);
    root.add(body);
    scene.add(root);

    const angleReadout = document.querySelector('#angle');
    const phaseReadout = document.querySelector('#phase');
    const openDuration = .85;
    const demoFlapAngularSpeed = 25 * .5;
    const flapDuration = 4 * 2 * Math.PI / demoFlapAngularSpeed;
    const closeDuration = .85;
    const foldedDuration = .45;
    const cycleDuration = openDuration + flapDuration + closeDuration + foldedDuration;
    const ease = value => value * value * (3 - 2 * value);
    let last = performance.now();
    function frame(now) {
      const dt = Math.min((now - last) / 1000, .05);
      last = now;
      const cycleTime = (now / 1000) % cycleDuration;
      let stage;
      if (cycleTime < openDuration) {
        actor.wingOpen = ease(cycleTime / openDuration);
        actor.wingFlapAmount = 0;
        actor.gait = 0;
        stage = 'OPENING';
      } else if (cycleTime < openDuration + flapDuration) {
        actor.wingOpen = 1;
        actor.wingFlapAmount = 1;
        actor.gait = (cycleTime - openDuration) * demoFlapAngularSpeed;
        stage = 'FLAPPING';
      } else if (cycleTime < openDuration + flapDuration + closeDuration) {
        const closing = (cycleTime - openDuration - flapDuration) / closeDuration;
        actor.wingOpen = 1 - ease(closing);
        actor.wingFlapAmount = 1 - ease(closing);
        actor.gait = 0;
        stage = 'CLOSING';
      } else {
        actor.wingOpen = 0;
        actor.wingFlapAmount = 0;
        actor.gait = 0;
        stage = 'FOLDED';
      }
      animateGoose(actor, dt * .5, false, actor.speed);
      const degrees = Math.round(Math.sin(actor.gait) * actor.wingFlapAmount * THREE.MathUtils.radToDeg(WING_FLAP_AMPLITUDE));
      phaseReadout.textContent = `FLIGHT PHASE · ${stage}`;
      angleReadout.textContent = `FLAP ANGLE ${degrees > 0 ? '+' : ''}${degrees}°`;
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
