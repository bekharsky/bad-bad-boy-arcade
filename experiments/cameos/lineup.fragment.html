<div id="cameo-lineup">
  <div class="viz-controls">
    <label class="form-label">Ракурс <output id="lineup-angle-value" class="tabular-nums">0°</output>
      <input id="lineup-angle" class="form-range" type="range" min="-180" max="180" step="1" value="0" aria-label="Ракурс">
    </label>
    <label class="form-label">Движение
      <select id="lineup-motion" class="form-select">
        <option value="still">Стойка</option>
        <option value="run">Бег</option>
        <option value="turn">Бег с поворотами</option>
      </select>
    </label>
    <label class="form-check form-switch"><input id="lineup-portrait" class="form-check-input" type="checkbox" checked><span class="form-check-label">Крупный план</span></label>
  </div>
  <div class="lineup-grid">
    <section><h3>Риикка Пурра</h3><div class="lineup-stage"><canvas data-kind="purra" role="img" aria-label="Цельная 3D-модель Риикки Пурры"></canvas></div></section>
    <section><h3>Петтери Орпо</h3><div class="lineup-stage"><canvas data-kind="orpo" role="img" aria-label="Цельная 3D-модель Петтери Орпо"></canvas></div></section>
    <section><h3>Санна Марин</h3><div class="lineup-stage"><canvas data-kind="marin" role="img" aria-label="Цельная 3D-модель Санны Марин"></canvas></div></section>
    <section><h3>Александер Стубб</h3><div class="lineup-stage"><canvas data-kind="stubb" role="img" aria-label="Цельная 3D-модель Александера Стубба"></canvas></div></section>
    <section><h3>Владимир Путин</h3><div class="lineup-stage"><canvas data-kind="putin" role="img" aria-label="Цельная 3D-модель Владимира Путина"></canvas></div></section>
    <section><h3>Дональд Трамп</h3><div class="lineup-stage"><canvas data-kind="trump" role="img" aria-label="Цельная 3D-модель Дональда Трампа"></canvas></div></section>
  </div>
  <div id="lineup-error" class="text-destructive" role="alert" hidden></div>
  <details class="text-small"><summary>Как устроены модели</summary>
    <p>Головы и причёски собраны из объёмной геометрии. Лица, очки и одежда тоже геометрические; фото и фототекстуры в отображении не используются.</p>
  </details>
</div>
<style>
#cameo-lineup .lineup-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; margin-block: 12px 16px; }
#cameo-lineup h3 { text-align: center; }
#cameo-lineup .lineup-stage { height: 270px; }
#cameo-lineup canvas { display: block; width: 100%; height: 100%; }
@media(max-width: 520px) {
  #cameo-lineup .lineup-grid { grid-template-columns: 1fr; }
  #cameo-lineup .lineup-stage { height: 250px; }
}
</style>
<script type="module" id="lineup-script"></script>
