<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12151f" />
    <title>Golden Blast Helsinki — Bad Bad Boy Arcade</title>
    <link rel="stylesheet" href="./style.css?v=20261027-clean-ui1" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three-0.180.0/build/three.module.min.js",
          "three/addons/": "./vendor/three-0.180.0/examples/jsm/",
          "game": "./game.js?v=20261027-maps1",
          "./waves.js": "./waves.js?v=20261027-maps4",
          "./batteries.js": "./batteries.js?v=20261027-maps1",
          "./maps/index.js": "./maps/index.js?v=20261027-maps1",
          "./maps/harbor.js": "./maps/harbor.js?v=20261027-maps1",
          "./maps/harbor-scenery.js": "./maps/harbor-scenery.js?v=20261027-maps1",
          "./world/navigation.js": "./world/navigation.js?v=20261027-maps1",
          "./world/map.js": "./world/map.js?v=20261027-maps1",
          "./world/map-manager.js": "./world/map-manager.js?v=20261027-maps1",
          "./world/dispose.js": "./world/dispose.js?v=20261027-maps1",
          "./world/building-visibility.js": "./world/building-visibility.js?v=20261027-maps1",
          "./game-input.js": "./game-input.js?v=20261027-input3",
          "./enemy-pressure.js": "./enemy-pressure.js?v=20261026-harbor2",
          "./movement.js": "./movement.js?v=20261026-steering1",
          "./mouse-aim.js": "./mouse-aim.js?v=20261027-ground-aim1",
          "./aim-assist.js": "./aim-assist.js?v=20261026-assist1",
          "./touch-controls.js": "./touch-controls.js?v=20261026-precision1",
          "./hero.js": "./hero.js?v=20261025-medkits1",
          "./enemies.js": "./enemies.js?v=20261027-maps1",
          "./liquid.js": "./liquid.js?v=20261027-clarion1",
          "./bites.js": "./bites.js?v=20261025-medkits1",
          "./medkits.js": "./medkits.js?v=20261027-maps1"
        }
      }
    </script>
    <script defer src="./bootstrap.js?v=20261025-medkits1"></script>
  </head>
  <body>
    <main class="game-shell">
      <canvas id="game" tabindex="0" aria-label="Bad Bad Boy arcade game"></canvas>
      <div id="hero-hud" class="hero-hud" hidden><div id="hero-power" class="hero-power" hidden></div><div class="hero-hp" role="meter" aria-label="Health" aria-valuemin="0" aria-valuemax="5" aria-valuenow="5"><span id="hero-hp-fill"></span></div></div>

      <header class="hud">
        <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><span>GOLDEN BLAST <span class="brand-city">HELSINKI</span></span></div>
        <div class="stat"><span class="stat-label">WAVE</span><strong id="wave">1</strong></div>
        <div class="stat"><span class="stat-label">SCORE</span><strong id="score">0000</strong></div>
      </header>

      <section id="start-screen" class="overlay">
        <div class="card">
          <h1><span class="title-line">GOLDEN</span><span class="title-line title-accent">BLAST</span><span class="title-line">HELSINKI</span></h1>
          <div id="load-status" class="load-status" role="status">Loading models…</div>
          <button id="start" class="primary-button" type="button" disabled>LOADING…</button>
          <button id="retry-load" class="primary-button" type="button" hidden>RETRY LOADING</button>
          <button id="open-settings" class="settings-button" type="button" aria-label="Controls" aria-haspopup="dialog" aria-controls="controls-dialog">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 3-.5 2.1-1.6.9-2.1-.6-2 3.4 1.6 1.5v1.9l-1.6 1.5 2 3.4 2.1-.6 1.6.9L9 20h4l.5-2.1 1.6-.9 2.1.6 2-3.4-1.6-1.5v-1.9l1.6-1.5-2-3.4-2.1.6-1.6-.9L13 3Z"/><circle cx="11" cy="11.5" r="3"/></svg>
          </button>
        </div>
      </section>

      <section id="end-screen" class="overlay hidden">
        <div class="card end-card">
          <h2 id="end-title">WASTED</h2>
          <button id="restart" class="primary-button" type="button">PLAY AGAIN</button>
        </div>
      </section>

      <dialog id="controls-dialog" class="card controls-card" aria-labelledby="controls-title">
        <h2 id="controls-title">CONTROLS</h2>
        <fieldset class="control-setting" aria-label="Movement">
          <div class="control-options">
            <label class="control-option"><input type="radio" name="game-movement" value="direct" data-control-mode /><span class="control-choice"><strong>Direct</strong><span>Screen directions</span></span></label>
            <label class="control-option"><input type="radio" name="game-movement" value="tank" data-control-mode checked /><span class="control-choice"><strong>Tank</strong><span>Move & turn</span></span></label>
          </div>
        </fieldset>
        <label class="assist-setting"><input type="checkbox" data-aim-assist checked /><span class="assist-switch" aria-hidden="true"></span><span class="assist-copy"><strong>Aim assist</strong><span>Direct only</span></span></label>
        <label class="assist-setting" hidden><input type="checkbox" data-mouse-aim checked /><span class="assist-switch" aria-hidden="true"></span><span class="assist-copy"><strong>Mouse aim</strong></span></label>
        <label class="assist-setting"><input id="sound-setting" type="checkbox" /><span class="assist-switch" aria-hidden="true"></span><span class="assist-copy"><strong>Sound</strong></span></label>
        <form method="dialog"><button id="settings-done" class="primary-button" type="submit">DONE</button></form>
        <a class="credits-link" href="./credits.html" target="_blank" rel="noopener">Models & credits ↗</a>
      </dialog>

      <div class="range-hud" aria-label="Spray range" hidden>
        <strong id="spray-range">0.9 m</strong>
        <div class="pressure-track"><span id="pressure-fill"></span></div>
      </div>
      <div class="mobile-controls" aria-label="Touch controls">
        <div id="joystick-zone" class="joystick-zone" aria-label="Drag to move and aim">
          <div class="joystick-hint touch-control" aria-hidden="true">MOVE</div>
          <div id="joystick" class="joystick" aria-hidden="true" hidden><div id="joystick-thumb" class="joystick-thumb"></div></div>
        </div>
        <button id="mobile-fire" class="fire-button touch-control" type="button" aria-label="Spray">SPRAY</button>
      </div>
      <div id="toast" class="toast" aria-live="polite"></div>
    </main>
  </body>
</html>
